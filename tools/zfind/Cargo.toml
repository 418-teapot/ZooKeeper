[package]
name = "zfind"
version = "0.1.0"
edition = "2024"
description = "ZooKeeper session finder — search OpenCode sessions and messages in SQLite"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
zutil = { path = "../zutil", features = ["db-helpers"] }
rich_rust = "0.2.2"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
