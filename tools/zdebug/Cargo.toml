[package]
name = "zdebug"
version = "0.1.0"
edition = "2024"
description = "ZooKeeper debug — autonomous debugging loop state base CLI"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", default-features = false, features = ["fs", "signal", "user"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
zutil = { path = "../zutil", features = ["file-lock"] }

[dev-dependencies]
tempfile = "3"
