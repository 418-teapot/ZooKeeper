[package]
name = "ztrace"
version = "0.1.0"
edition = "2024"
description = "ZooKeeper trace -- full orchestration trace with timeline merging for OpenCode sessions."

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
sha2 = "0.10"
zutil = { path = "../zutil", features = ["db-helpers"] }
rich_rust = "0.2.2"
shlex = "2"

[dev-dependencies]
tempfile = "3"
