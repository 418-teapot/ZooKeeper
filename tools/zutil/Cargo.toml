[package]
name = "zutil"
version = "0.1.0"
edition = "2024"
description = "Shared utility library for ZooKeeper CLI tools"

[dependencies]
chrono = "0.4"
dirs = "6"
glob = "0.3"
serde_json = "1"
rich_rust = "0.2.2"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
fs2 = { version = "0.4", optional = true }
shlex = { version = "2", optional = true }

[features]
db-helpers = ["rusqlite", "shlex"]
file-lock = ["fs2"]
