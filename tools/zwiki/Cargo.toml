[package]
name = "zwiki"
version = "0.1.0"
edition = "2024"
description = "ZooKeeper wiki — manage ~/.zoo/wiki/ knowledge from the command line."

[dependencies]
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs2 = "0.4"
glob = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.8"
walkdir = "2"
zutil = { path = "../zutil", features = ["file-lock"] }
