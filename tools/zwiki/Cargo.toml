[package]
name = "zwiki"
version = "0.1.0"
edition = "2024"
description = "ZooKeeper wiki — manage ~/.zoo/wiki/ knowledge from the command line."

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zutil = { path = "../zutil" }
