[package]
name = "zinspect"
version = "0.1.0"
edition = "2024"
description = "ZooKeeper session inspector -- stats, timeline, and impact analysis for OpenCode sessions."

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
zutil = { path = "../zutil", features = ["db-helpers"] }
rich_rust = "0.2.2"
