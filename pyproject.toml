[project]
name = "zookeeper"
version = "0.1.0"
requires-python = ">=3.11"
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "rich>=15.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["I"]

[tool.coverage.run]
omit = ["tools/zoo-trace"]

[tool.coverage.report]
fail_under = 90
