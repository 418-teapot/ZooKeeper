[project]
name = "zookeeper"
version = "0.1.0"
requires-python = ">=3.11"
[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "isort>=6.0.0",
    "pytest>=8.0",
    "rich>=15.0.0",
    "ruff>=0.9.0",
]

[tool.isort]
atomic = true
combine_as_imports = true
include_trailing_comma = true
line_length = 79
multi_line_output = 3
skip_gitignore = true

[tool.ruff]
line-length = 79
