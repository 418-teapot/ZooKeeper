# ZooKeeper 配置
# {env:VAR} 引用会在 install.py 运行时解析为 .env 中的实际值

"$schema" = "https://opencode.ai/config.json"

# ── Aliyun ────────────────────────────────────────────────────────────────────

[provider.Aliyun]
npm = "@ai-sdk/anthropic"

[provider.Aliyun.options]
baseURL = "{env:CAMBRICON_BASE_URL}"
apiKey  = "{env:CAMBRICON_API_KEY}"

[provider.Aliyun.options.headers]
x-project = "personal"

[provider.Aliyun.models."deepseek-v4-pro"]
name = "aliyun/deepseek-v4-pro"
id   = "aliyun/deepseek-v4-pro"

[provider.Aliyun.models."deepseek-v4-pro".limit]
context = 1000000
output  = 384000

[provider.Aliyun.models."deepseek-v4-pro".cost]
input       = 11.76
output      = 23.52

[provider.Aliyun.models."deepseek-v4-flash"]
name = "aliyun/deepseek-v4-flash"
id   = "aliyun/deepseek-v4-flash"
reasoning = true

[provider.Aliyun.models."deepseek-v4-flash".limit]
context = 1000000
output  = 384000

[provider.Aliyun.models."deepseek-v4-flash".cost]
input       = 0.98
output      = 1.96

[provider.Aliyun.models."glm-5.2"]
name = "aliyun/glm-5.2"
id   = "aliyun/glm-5.2"

[provider.Aliyun.models."glm-5.2".cost]
input       = 6.8
output      = 23.8
cache_read  = 0
cache_write = 0

[provider.Aliyun.models."qwen3.7-max"]
name = "aliyun/qwen3.7-max"
id   = "aliyun/qwen3.7-max"

[provider.Aliyun.models."qwen3.7-max".cost]
input       = 6.0
output      = 18.0
cache_read  = 0.6
cache_write = 7.5

