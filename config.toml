# ── Defaults ──────────────────────────────────────────────────────────────────

[defaults]
model       = "{env:ZOO_WHALE_MODEL}"
small_model = "{env:ZOO_ANT_MODEL}"

# ── MCP ───────────────────────────────────────────────────────────────────────
[mcp.gitlab]
type = "remote"
url  = "{env:GITLAB_MCP_URL}"
[mcp.gitlab.headers]
Private-Token = "{env:GITLAB_ACCESS_TOKEN}"

[mcp.jira]
type = "remote"
url  = "{env:JIRA_MCP_URL}"
[mcp.jira.headers]
Authorization = "Token {env:JIRA_ACCESS_TOKEN}"

[mcp.wiki]
type = "remote"
url  = "{env:WIKI_MCP_URL}"
[mcp.wiki.headers]
Authorization = "Basic {env:WIKI_BASIC_AUTH}"

[mcp.jsd]
type = "remote"
url  = "{env:JSD_MCP_URL}"
[mcp.jsd.headers]
Authorization = "Basic {env:JSD_BASIC_AUTH}"

# ── Validation ────────────────────────────────────────────────────────────────

[zoo.validation]
context_word_limit = 200
prompt_word_limit = 500

# ── Variants ──────────────────────────────────────────────────────────────────

[zoo.variants]
"Cambricon/glm-5.2"            = "high"
"OpenCodeGo/deepseek-v4-flash" = "max"
"OpenAI/gpt-5.5"               = "high"

[zoo.variants.beaver]
"OpenAI/gpt-5.5" = "low"

# ── Context ───────────────────────────────────────────────────────────────────

[zoo.context]
# 消息条数保护：从末尾倒数 N 条非 ignored 消息计入保护区
protected_messages = 20
# 批量释放阈值（百分比）：pending 标记合计达到上下文长度该百分比时统一批量释放
released_percent = 10
# 首条 user 消息锚定阈值（tokens）：首条非 ignored user 消息的 token 估算不超过该值时
# 跳过 ref 分配（受保护，永不裁剪）；超过则按普通消息处理；0 = 不锚定（缺键同义）
anchor_tokens = 2000

[zoo.context.dedup]
threshold_context = 100000
protected_tools = []

[zoo.context.purge_errors]
threshold_context = 100000
protected_tools = []

[zoo.context.compress]
# 压缩阈值（tokens）：小于此值的段跳过压缩（幻影门禁）
threshold_tokens = 2000
# 压缩保护区（tokens）：末尾累计达到此值后不压缩
protected_tokens = 20000
# 单次批量压缩调用允许的最大范围数：超限报错引导分批提交
max_ranges = 8

[zoo.context.decompress]
# 解压回填上界阈值（百分比）
max_fill_percent = 90

[zoo.context.nudge]
# 温和提醒阈值
min_context = "60%"
min_context_cap = 200000
# 紧急提醒阈值：达到后提醒升级为紧急级（完成当前原子步骤后立即 compress）
max_context = "80%"
max_context_cap = 300000
# 提醒节奏（tokens 或百分比）
growth_tokens = "5%"

# 示例：[zoo.context.nudge.models."<modelID>"] 下的键会覆盖上方同名阈值

# ── Logging ───────────────────────────────────────────────────────────────────

[zoo.logging]
# 单文件上限 (MB)
max_file_size_mb = 5
# 保留的轮转备份数
max_backups = 2
# 自动清理多少天前的日志
retention_days = 7

# ── Mode 模式 ─────────────────────────────────────────────────────────────────
[zoo.mode.poly]
agents = [
  "dolphin",
  "mola",
  "beaver",
  "lynx",
  "spider",
  "eagle",
  "kiwi",
]
skills = [
  "beaver-tdd",
  "code-review",
  "compress-usage",
  "first-principles",
  "git-commit",
  "grill",
  "kiwi-distill",
  "kiwi-verify",
  "mola-plan",
  "wiki-ingest",
  "wiki-query",
  "wiki-verify",
]
hooks = [
  "context-pruning",
  "direct-work-nudge",
  "json-error-nudge",
  "post-task-nudge",
  "reply-strip",
  "task-delegation",
  "task-prompt",
]
tools = [
  "compress",
  "decompress",
  "subagent",
]
commands = [
  "go",
  "dcp",
  "switch",
]

[zoo.mode.mono]
agents = [
  "dolphin",
  "mola",
]
skills = [
  "compress-usage",
  "first-principles",
  "git-commit",
  "grill",
  "mola-plan",
  "wiki-query",
]
hooks = [
  "context-pruning",
  "json-error-nudge",
  "reply-strip",
]
tools = [
  "compress",
  "decompress",
]
commands = [
  "go",
  "dcp",
  "switch",
]
