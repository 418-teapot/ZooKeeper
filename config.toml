# ── Agents ────────────────────────────────────────────────────────────────────

[agent.dolphin]
mode  = "primary"
model = "{env:ZOO_WHALE_MODEL}"
color = "#66CCFF"
[agent.dolphin.permission]
webfetch = "deny"
websearch = "deny"
[agent.dolphin.permission.bash]
"git checkout *" = "ask"
"git clean *"    = "ask"
"git commit *"   = "ask"
"git reset *"    = "ask"
"git restore *"  = "ask"
"git stash"      = "ask"
"rm *"           = "ask"
[agent.dolphin.permission.skill]
"beaver-*" = "deny"
"kiwi-*"   = "deny"
"mola-*"   = "deny"

[agent.mola]
mode  = "primary"
model = "{env:ZOO_WHALE_MODEL}"
color = "#FFA500"
[agent.mola.permission]
[agent.mola.permission.bash]
