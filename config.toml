# ── Agents ────────────────────────────────────────────────────────────────────

[agent.dolphin]
model = "{env:ZOO_WHALE_MODEL}"
color = "#66CCFF"
[agent.dolphin.permission]
webfetch = "deny"
websearch = "deny"
[agent.dolphin.permission.skill]
"kiwi-*" = "deny"
"mola-*" = "deny"

[agent.mola]
model = "{env:ZOO_WHALE_MODEL}"
color = "#FFA500"
[agent.mola.permission]
webfetch  = "deny"
websearch = "deny"
[agent.mola.permission.external_directory]
"~/.zoo/plans/**" = "allow"
[agent.mola.permission.edit]
"~/.zoo/plans/**" = "allow"
[agent.mola.permission.skill]
"*"          = "deny"
"grill"      = "allow"
"mola-plan"  = "allow"
"wiki-query" = "allow"

[agent.lynx]
mode  = "subagent"
model = "{env:ZOO_ANT_MODEL}"
color = "#FFE211"
[agent.lynx.permission]
edit = "deny"
task = "deny"
[agent.lynx.permission.skill]
"*" = "deny"
"wiki-query" = "allow"

[agent.beaver]
mode  = "subagent"
model = "{env:ZOO_ANT_MODEL}"
color = "#39C5BB"
[agent.beaver.permission]
webfetch = "deny"
websearch = "deny"
[agent.beaver.permission.skill]
"*" = "deny"
"git-commit" = "allow"
"wiki-query" = "allow"

[agent.spider]
mode  = "subagent"
model = "{env:ZOO_ANT_MODEL}"
[agent.spider.permission]
edit = "deny"
bash = "deny"
task = "deny"
[agent.spider.permission.skill]
"*" = "deny"
"wiki-query" = "allow"

[agent.eagle]
mode  = "subagent"
model = "{env:ZOO_WHALE_MODEL}"
color = "#961E32"
[agent.eagle.permission]
edit = "deny"
task = "deny"
webfetch = "deny"
websearch = "deny"
[agent.eagle.permission.skill]
"*" = "deny"
"wiki-query" = "allow"

[agent.kiwi]
mode  = "subagent"
model = "{env:ZOO_HIPPO_MODEL}"
[agent.kiwi.permission]
task = "deny"
edit = "deny"
[agent.kiwi.permission.skill]
"*" = "deny"
"kiwi-*" = "allow"

# 禁用内置 agent
[agent.plan]
disable = true

[agent.build]
disable = true

[agent.general]
disable = true

[agent.explore]
disable = true

# ── Defaults ──────────────────────────────────────────────────────────────────

[defaults]
model       = "{env:ZOO_WHALE_MODEL}"
small_model = "{env:ZOO_ANT_MODEL}"

# ── Validation ────────────────────────────────────────────────────────────────

[zoo.validation]
context_word_limit = 200
prompt_word_limit = 500

# ── Logging ───────────────────────────────────────────────────────────────────

[zoo.logging]
# 单文件上限 (MB)，0 或不填使用默认 5 MB
max_file_size_mb = 5
# 保留的轮转备份数，设为 0 不轮转
max_backups = 2
# 自动清理多少天前的日志
retention_days = 7

# ── Skills ────────────────────────────────────────────────────────────────────
# 每个 core/skills/ 下的子目录对应一个内建技能。
# 可用值："enable"（启用）| "disable"（禁用）

[zoo.skills]
code-review  = "enable"
git-commit   = "enable"
grill        = "enable"
kiwi-distill = "enable"
kiwi-verify  = "enable"
mola-plan    = "enable"
wiki-ingest  = "enable"
wiki-query   = "enable"
wiki-verify  = "enable"
