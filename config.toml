# ZooKeeper 配置
# {env:VAR} 引用会在 install.py 运行时解析为 .env 中的实际值

"$schema" = "https://opencode.ai/config.json"

[provider.Cambricon]
npm = "@ai-sdk/anthropic"

[provider.Cambricon.options]
baseURL = "{env:CAMBRICON_BASE_URL}"
apiKey  = "{env:CAMBRICON_API_KEY}"

[provider.Cambricon.options.headers]
x-project = "personal"

[provider.Cambricon.models.deepseek-v4-pro]
name = "aliyun/deepseek-v4-pro"
id   = "aliyun/deepseek-v4-pro"
reasoning = true

[provider.Cambricon.models.deepseek-v4-pro.limit]
context = 1000000
output  = 384000

[provider.Cambricon.models.deepseek-v4-pro.cost]
input       = 11.76
output      = 23.52

[provider.Cambricon.models.deepseek-v4-flash]
name = "aliyun/deepseek-v4-flash"
id   = "aliyun/deepseek-v4-flash"
reasoning = true

[provider.Cambricon.models.deepseek-v4-flash.limit]
context = 1000000
output  = 384000

[provider.Cambricon.models.deepseek-v4-flash.cost]
input       = 0.98
output      = 1.96

[provider.Cambricon.models."glm-5.1"]
name = "aliyun/glm-5.1"
id   = "aliyun/glm-5.1"

[provider.Cambricon.models."glm-5.1".cost]
input       = 6.8
output      = 23.8
cache_read  = 0.68
cache_write = 8.5

[provider.Cambricon.models."qwen3.7-max"]
name = "aliyun/qwen3.7-max"
id   = "aliyun/qwen3.7-max"

[provider.Cambricon.models."qwen3.7-max".cost]
input       = 6.0
output      = 18.0
cache_read  = 0.6
cache_write = 7.5

# ── DeepSeek ────────────────────────────────────────────────────────────────

[provider.DeepSeek]
npm = "@ai-sdk/anthropic"

[provider.DeepSeek.options]
baseURL = "{env:DEEPSEEK_BASE_URL}"
apiKey  = "{env:DEEPSEEK_API_KEY}"

[provider.DeepSeek.models.deepseek-v4-pro]
name = "deepseek-v4-pro"
id   = "deepseek-v4-pro"
reasoning = true

[provider.DeepSeek.models.deepseek-v4-pro.limit]
context = 1000000
output  = 384000

[provider.DeepSeek.models.deepseek-v4-pro.cost]
input       = 1.74
output      = 3.48
cache_read  = 0.145
cache_write = 0

[provider.DeepSeek.models.deepseek-v4-flash]
name = "deepseek-v4-flash"
id   = "deepseek-v4-flash"
reasoning = true

[provider.DeepSeek.models.deepseek-v4-flash.limit]
context = 1000000
output  = 384000

[provider.DeepSeek.models.deepseek-v4-flash.cost]
input       = 0.14
output      = 0.28
cache_read  = 0.028
cache_write = 0

# ── Agents ──────────────────────────────────────────────────────────────────

[agent.build]
model = "{env:ZOO_MODEL}"
[agent.build.permission]
webfetch = "deny"
websearch = "deny"

[agent.explore]
model = "{env:ZOO_SMALL_MODEL}"
[agent.explore.permission]
edit = "deny"
write = "deny"
task = "deny"

[agent.general]
model = "{env:ZOO_SMALL_MODEL}"
[agent.general.permission]
task = "deny"
webfetch = "deny"
websearch = "deny"

[agent.spider]
mode  = "subagent"
model = "{env:ZOO_SMALL_MODEL}"
[agent.spider.permission]
edit = "deny"
write = "deny"
bash = "deny"
task = "deny"
read = "deny"
glob = "deny"
grep = "deny"

[agent.eagle]
mode  = "subagent"
model = "{env:ZOO_MODEL}"
[agent.eagle.permission]
write = "deny"
edit = "deny"
task = "deny"
webfetch = "deny"
websearch = "deny"

[agent.kiwi]
mode  = "subagent"
model = "{env:ZOO_MODEL}"
[agent.kiwi.permission]
task = "deny"
write = "deny"
edit = "deny"

# ── Defaults ────────────────────────────────────────────────────────────────

[defaults]
model       = "{env:ZOO_MODEL}"
small_model = "{env:ZOO_SMALL_MODEL}"

# ── Validation ──────────────────────────────────────────────────────────────

[zoo.validation]
context_word_limit = 200
prompt_word_limit = 500

# ── Logging ──────────────────────────────────────────────────────────────────

[zoo.logging]
# 插件日志写入目录，支持 ~ 展开
dir = "~/.zoo/log"
# 单文件上限 (MB)，0 或不填使用默认 5 MB
max_file_size_mb = 5
# 保留的轮转备份数，设为 0 不轮转
max_backups = 2
# 自动清理多少天前的日志
retention_days = 7

# ── Skills ──────────────────────────────────────────────────────────────────
# 每个 core/skills/ 下的子目录对应一个内建技能。
# 可用值："enable"（启用）| "disable"（禁用）

[zoo.skills]
git-commit = "enable"
code-review = "enable"
wiki-ingest = "enable"
wiki-query = "enable"
