# ZooKeeper 配置
# {env:VAR} 引用会在 install.py 运行时解析为 .env 中的实际值

"$schema" = "https://opencode.ai/config.json"

[provider.Cambricon]
npm = "@ai-sdk/anthropic"

[provider.Cambricon.options]
baseURL = "{env:CAMBRICON_BASE_URL}"
apiKey  = "{env:CAMBRICON_API_KEY}"

[provider.Cambricon.models.deepseek-v4-pro]
name = "aliyun/deepseek-v4-pro"
id   = "aliyun/deepseek-v4-pro"
reasoning = true

[provider.Cambricon.models.deepseek-v4-pro.limit]
context = 1000000
output  = 384000

[provider.Cambricon.models.deepseek-v4-pro.cost]
input       = 0
output      = 0
cache_read  = 0
cache_write = 0

[provider.Cambricon.models.deepseek-v4-flash]
name = "aliyun/deepseek-v4-flash"
id   = "aliyun/deepseek-v4-flash"
reasoning = true

[provider.Cambricon.models.deepseek-v4-flash.limit]
context = 1000000
output  = 384000

[provider.Cambricon.models.deepseek-v4-flash.cost]
input       = 0
output      = 0
cache_read  = 0
cache_write = 0

[provider.Cambricon.models."glm-5.1"]
name = "aliyun/glm-5.1"
id   = "aliyun/glm-5.1"

[provider.Cambricon.models."qwen3.7-max"]
name = "aliyun/qwen3.7-max"
id   = "aliyun/qwen3.7-max"

# ── DeepSeek ────────────────────────────────────────────────────────────────

[provider.DeepSeek]
npm = "@ai-sdk/anthropic"

[provider.DeepSeek.options]
baseURL = "{env:DEEPSEEK_BASE_URL}"
apiKey  = "{env:DEEPSEEK_API_KEY}"

[provider.DeepSeek.models.deepseek-v4-pro]
name = "deepseek-v4-pro"
id   = "deepseek-v4-pro"
reasoning = true

[provider.DeepSeek.models.deepseek-v4-pro.limit]
context = 1000000
output  = 384000

[provider.DeepSeek.models.deepseek-v4-pro.cost]
input       = 1.74
output      = 3.48
cache_read  = 0.145
cache_write = 0

[provider.DeepSeek.models.deepseek-v4-flash]
name = "deepseek-v4-flash"
id   = "deepseek-v4-flash"
reasoning = true

[provider.DeepSeek.models.deepseek-v4-flash.limit]
context = 1000000
output  = 384000

[provider.DeepSeek.models.deepseek-v4-flash.cost]
input       = 0.14
output      = 0.28
cache_read  = 0.028
cache_write = 0

# ── Agents ──────────────────────────────────────────────────────────────────

[agent.build]
model = "{env:ZOO_MODEL}"
[agent.build.permission]
webfetch = "deny"
websearch = "deny"

[agent.explore]
model = "{env:ZOO_SMALL_MODEL}"
[agent.explore.permission]
edit = "deny"
write = "deny"
task = "deny"

[agent.general]
model = "{env:ZOO_SMALL_MODEL}"
[agent.general.permission]
task = "deny"
webfetch = "deny"
websearch = "deny"

[agent.spider]
mode  = "subagent"
model = "{env:ZOO_SMALL_MODEL}"
[agent.spider.permission]
edit = "deny"
write = "deny"
bash = "deny"
task = "deny"
read = "deny"
glob = "deny"
grep = "deny"

# ── Defaults ────────────────────────────────────────────────────────────────

[defaults]
model       = "{env:ZOO_MODEL}"
small_model = "{env:ZOO_SMALL_MODEL}"

# ── Compaction ────────────────────────────────────────────────────────────
# OpenCode 内置压缩（V1 层 —— 工具输出剪枝 + overflow 检测）
# V2 层 LLM 摘要压缩始终自动运行，不受此段控制。

[compaction]
auto = true           # 启用自动压缩（默认 true）
prune = true          # 启用工具输出剪枝（默认 false，需手动开）
tail_turns = 2        # 压缩时保留最近 N 轮交互

# ── Validation ──────────────────────────────────────────────────────────────

[zoo.validation]
context_word_limit = 200
prompt_word_limit = 500

# ── Logging ──────────────────────────────────────────────────────────────────

[zoo.logging]
# 插件日志写入目录，支持 ~ 展开
dir = "~/.zoo/log"
# 单文件上限 (MB)，0 或不填使用默认 5 MB
max_file_size_mb = 5
# 保留的轮转备份数，设为 0 不轮转
max_backups = 2
# 自动清理多少天前的日志
retention_days = 7

# ── Skills ──────────────────────────────────────────────────────────────────
# 每个 core/skills/ 下的子目录对应一个内建技能。
# 可用值："enable"（启用）| "disable"（禁用）

[zoo.skills]
git-commit = "enable"

# ── Context Pruning ─────────────────────────────────────────────────────────
# 控制 ZooKeeper 内置的上下文剪枝行为。
# 每个字段都有默认值，可选择性覆盖。

[zoo.context]
enabled = true

# Token 计数：优先使用 API 上报的精确数据，仅在新增 in-progress 消息时回退启发式
# 阈值 = min(百分比 × 模型窗口, 绝对上限)。任一缺失则用另一值。
nudge_threshold_percent = 20       # 模型上下文窗口的百分比（1M → 200K）
urgent_threshold_percent = 40      # 模型上下文窗口的百分比（1M → 400K）
nudge_threshold_absolute = 200000  # 绝对 token 上限（百分比未知时的 fallback）
urgent_threshold_absolute = 400000 # 绝对 token 上限

# 自动策略
dedup_enabled = false               # 去重（暂时关闭，待实现）
purge_errors_enabled = false        # 清除错误工具输入（暂时关闭，待实现）
purge_errors_turns = 3              # 错误清除前的等待轮数

# 压缩（启发式范围压缩，无需 LLM 调用）
compress_enabled = false            # 压缩（暂时关闭，待实现）
compress_mode = "range"             # "range" | "message"
compress_nudge_frequency = 5        # nudge 注入间隔（降低频率，减少干扰）

# LLM 驱动压缩
compress_llm_enabled = false        # 注册 compress 工具供模型调用
compress_message_mode_enabled = false # 启用 Message 模式（单消息粒度的 LLM 压缩）

# 命令系统
commands_enabled = false            # 启用 /context、/stats、/sweep 等命令

# 跨会话持久化
persist_state = false               # 会话状态持久化（暂时关闭，待实现）

# 保护规则 — 以下列表中的工具永不参与剪枝
protected_tools = [
  "task",
  "skill",
  "question",
  "todowrite",
  "todoread",
]

# 用户消息保护
protect_user_messages = true

# 最近 N 轮用户交互受保护（不参与压缩/剪枝）
turn_protection = 2

# 去重保护 — 列表中工具不参与去重
dedup_protected_tools = [
  "task",
  "skill",
  "read",
]

# 错误清除保护 — 列表中工具的错误不参与清除
purge_errors_protected_tools = [
  "task",
  "skill",
]
