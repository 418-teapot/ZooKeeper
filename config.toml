# ── Agents ────────────────────────────────────────────────────────────────────

[agent.dolphin]
model = "{env:ZOO_WHALE_MODEL}"
color = "#66CCFF"
[agent.dolphin.permission]
webfetch = "deny"
websearch = "deny"
[agent.dolphin.permission.bash]
"git checkout *" = "ask"
"git clean *"    = "ask"
"git commit *"   = "ask"
"git reset *"    = "ask"
"git restore *"  = "ask"
"git stash"      = "ask"
"rm *"           = "ask"
[agent.dolphin.permission.skill]
"beaver-*" = "deny"
"kiwi-*"   = "deny"
"mola-*"   = "deny"

[agent.mola]
model = "{env:ZOO_WHALE_MODEL}"
color = "#FFA500"
[agent.mola.permission]
webfetch  = "deny"
websearch = "deny"
[agent.mola.permission.bash]
"git checkout *" = "ask"
"git clean *"    = "deny"
"git commit *"   = "deny"
"git reset *"    = "deny"
"git restore *"  = "deny"
"git stash"      = "ask"
"rm *"           = "deny"
[agent.mola.permission.edit]
"*"       = "deny"
"**/*.md" = "allow"
[agent.mola.permission.skill]
"*"          = "deny"
"grill"      = "allow"
"mola-plan"  = "allow"
"wiki-query" = "allow"

[agent.lynx]
mode  = "subagent"
model = "{env:ZOO_ANT_MODEL}"
color = "#FFE211"
[agent.lynx.permission]
edit = "deny"
task = "deny"
[agent.lynx.permission.bash]
"git checkout *" = "ask"
"git clean *"    = "deny"
"git commit *"   = "deny"
"git reset *"    = "deny"
"git restore *"  = "deny"
"git stash"      = "ask"
"rm *"           = "deny"
[agent.lynx.permission.skill]
"*" = "deny"
"wiki-query" = "allow"

[agent.beaver]
mode  = "subagent"
model = "{env:ZOO_ANT_MODEL}"
color = "#39C5BB"
[agent.beaver.permission]
webfetch = "deny"
websearch = "deny"
[agent.beaver.permission.bash]
"git checkout *" = "ask"
"git clean *"    = "ask"
"git commit *"   = "ask"
"git reset *"    = "ask"
"git restore *"  = "ask"
"git stash"      = "ask"
"rm *"           = "ask"
[agent.beaver.permission.skill]
"*" = "deny"
"git-commit" = "allow"
"wiki-query" = "allow"
"beaver-tdd" = "allow"

[agent.spider]
mode  = "subagent"
model = "{env:ZOO_ANT_MODEL}"
[agent.spider.permission]
edit = "deny"
bash = "deny"
task = "deny"
[agent.spider.permission.skill]
"*" = "deny"
"wiki-query" = "allow"

[agent.eagle]
mode  = "subagent"
model = "{env:ZOO_HIPPO_MODEL}"
color = "#961E32"
[agent.eagle.permission]
edit = "deny"
task = "deny"
webfetch = "deny"
websearch = "deny"
[agent.eagle.permission.bash]
"git checkout *" = "ask"
"git clean *"    = "deny"
"git commit *"   = "deny"
"git reset *"    = "deny"
"git restore *"  = "deny"
"git stash"      = "ask"
"rm *"           = "deny"
[agent.eagle.permission.skill]
"*" = "deny"
"wiki-query" = "allow"

[agent.kiwi]
mode  = "subagent"
model = "{env:ZOO_HIPPO_MODEL}"
[agent.kiwi.permission]
task = "deny"
edit = "deny"
[agent.kiwi.permission.bash]
"git checkout *" = "deny"
"git clean *"    = "deny"
"git commit *"   = "deny"
"git reset *"    = "deny"
"git restore *"  = "deny"
"git stash"      = "deny"
"rm *"           = "deny"
[agent.kiwi.permission.skill]
"*" = "deny"
"kiwi-*" = "allow"

# 禁用内置 agent
[agent.plan]
disable = true

[agent.build]
disable = true

[agent.general]
disable = true

[agent.explore]
disable = true

# ── Defaults ──────────────────────────────────────────────────────────────────

[defaults]
model       = "{env:ZOO_WHALE_MODEL}"
small_model = "{env:ZOO_ANT_MODEL}"

# ── MCP ───────────────────────────────────────────────────────────────────────
[mcp.gitlab]
type = "remote"
url  = "{env:GITLAB_MCP_URL}"
[mcp.gitlab.headers]
Private-Token = "{env:GITLAB_ACCESS_TOKEN}"

[mcp.jira]
type = "remote"
url  = "{env:JIRA_MCP_URL}"
[mcp.jira.headers]
Authorization = "Token {env:JIRA_ACCESS_TOKEN}"

[mcp.wiki]
type = "remote"
url  = "{env:WIKI_MCP_URL}"
[mcp.wiki.headers]
Authorization = "Basic {env:WIKI_BASIC_AUTH}"

[mcp.jsd]
type = "remote"
url  = "{env:JSD_MCP_URL}"
[mcp.jsd.headers]
Authorization = "Basic {env:JSD_BASIC_AUTH}"

# ── Validation ────────────────────────────────────────────────────────────────

[zoo.validation]
context_word_limit = 200
prompt_word_limit = 500

# ── Variants ──────────────────────────────────────────────────────────────────

[zoo.variants]
"Cambricon/glm-5.2"            = "high"
"OpenCodeGo/deepseek-v4-flash" = "max"

# ── Context ───────────────────────────────────────────────────────────────────

[zoo.context]
enabled = true
# 消息条数保护：从末尾倒数 N 条非 ignored 消息计入保护区
protected_messages = 20
# 批量释放阈值（百分比）：pending 标记合计达到上下文长度该百分比时统一批量释放
released_percent = 10

[zoo.context.dedup]
enabled = true
threshold_context = 100000
protected_tools = []

[zoo.context.purge_errors]
enabled = true
threshold_context = 100000
protected_tools = []

[zoo.context.compress]
enabled = true
# 压缩阈值（tokens）：小于此值的段跳过压缩（幻影门禁）
threshold_tokens = 2000
# 压缩保护区（tokens）：末尾累计达到此值后不压缩
protected_tokens = 20000

[zoo.context.nudge]
enabled = true
# 温和提醒阈值
min_context = "60%"
min_context_cap = 200000
# 紧急提醒阈值：达到后提醒升级为紧急级（完成当前原子步骤后立即 compress）
max_context = "80%"
max_context_cap = 300000
# 提醒节奏（tokens 或百分比）
growth_tokens = "5%"

# 示例：[zoo.context.nudge.models."<modelID>"] 下的键会覆盖上方同名阈值

# ── Logging ───────────────────────────────────────────────────────────────────

[zoo.logging]
# 单文件上限 (MB)
max_file_size_mb = 5
# 保留的轮转备份数
max_backups = 2
# 自动清理多少天前的日志
retention_days = 7

# ── Skills ────────────────────────────────────────────────────────────────────
# 每个 core/skills/ 下的子目录对应一个内建技能。
# 可用值："enable"（启用）| "disable"（禁用）
[zoo.skills]
beaver-tdd   = "enable"
code-review  = "enable"
git-commit   = "enable"
grill        = "enable"
kiwi-distill = "enable"
kiwi-verify  = "enable"
mola-plan    = "enable"
wiki-ingest  = "enable"
wiki-query   = "enable"
wiki-verify  = "enable"
